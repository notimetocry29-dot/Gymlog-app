name: tests
on:
  push:
    paths: ['index.html', 'app.js', 'app.css', 'i18n.js', 'exlib.js', 'quotes.js', 'guide.js', 'sw.js', 'manifest.webmanifest', 'privacy.html', '*.png', 'fonts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['index.html', 'app.js', 'app.css', 'i18n.js', 'exlib.js', 'quotes.js', 'guide.js', 'sw.js', 'manifest.webmanifest', 'privacy.html', '*.png', 'fonts/**', 'tests/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 2 }   # HEAD~1 is needed by check-build (precached file changed => sw.js must change)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      # BUILD == VER, every sw.js FILES entry exists, precached change => sw.js bumped (skips if there is no parent commit)
      - run: node tests/check-build.mjs
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2 && node tests/smoke.mjs
      # serves the repo itself; offline reload from the SW cache + one-time update button
      - run: node tests/offline.mjs
