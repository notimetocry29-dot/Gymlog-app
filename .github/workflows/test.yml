name: tests
on:
  push:
    paths: ['index.html', 'app.js', 'app.css', 'i18n.js', 'exlib.js', 'quotes.js', 'sw.js', 'tests/**', '.github/workflows/test.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2 && node tests/smoke.mjs
