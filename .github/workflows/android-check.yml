name: Android config check
# Every push/PR: android/app/build.gradle reads VER from app.js, so web-only commits can break the APK config too.
# Configures the project and compiles the debug Java (no signing secrets needed; *Release tasks are not run).
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with: { gradle-version: 8.9 }
      - name: Gradle configuration (version lookup, plugins, signing setup)
        run: gradle -p android help --no-daemon
      - name: Manifest merge + Java compile (debug)
        run: gradle -p android :app:processDebugMainManifest :app:compileDebugJavaWithJavac --no-daemon
