plugins { id 'com.android.application' }
android {
    namespace 'app.gymlog.twa'
    compileSdk 35
    defaultConfig {
        applicationId 'app.gymlog.twa'
        minSdk 24
        targetSdk 35
        versionCode = Integer.parseInt((project.findProperty('vCode') ?: '1').toString())
        versionName = "1.${project.findProperty('vCode') ?: '0'}"
    }
    signingConfigs {
        if (System.getenv('KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
