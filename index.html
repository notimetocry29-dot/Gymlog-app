<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>چيم لوج</title>
<style>
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
:root{--scb:#000;--sci:#0c0c0c;--font:"Figtree",system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;--fnum:inherit;--rad:14px;--radb:11px;--radp:99px;--bw:1px;--sh:none;--ttl:none;--ls:0;--bg:#0e0e0f;--s1:#17171a;--s2:#202024;--bd:#2d2d33;--tx:#ece8e1;--mu:#968f85;--ac:#c38d4f;--ac2:#e2b37c;--ok:#7bb072;--mid:#d6b05a;--bad:#d06c57;--onac:#160e05;--hero:#1d1810;--tx2:#cfc6b8;--ph:#55504a;--okbd:#3b5a37;--okbg:#1c2a1a;--midbd:#5c4d2a;--midbg:#2b2616;--badbg:#2a1a15;--acbd:#4a3a28;--acbg:#33261a;--oktx:#a6d69c;--midtx:#e5c97f;--badtx:#f0b3a3}
html[data-th=morning]{color-scheme:light;--scb:#faf7f1;--sci:#fffdf9;--bg:#f3eee5;--s1:#faf7f1;--s2:#ece5d8;--bd:#d4c9b6;--tx:#1d1a16;--mu:#675e52;--ac:#8f5518;--ac2:#7a4515;--ok:#3a7335;--mid:#85600d;--bad:#b0432e;--onac:#fff8ee;--hero:#f7f0e2;--tx2:#3a342b;--ph:#a39a8a;--okbd:#a8c9a0;--okbg:#e4f0df;--midbd:#d8c283;--midbg:#f6edcf;--badbg:#f6dfd7;--acbd:#d9b78e;--acbg:#f3e4d0;--oktx:#2a5c26;--midtx:#6b4e08;--badtx:#8a2f1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font)}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:18px;flex:1}
main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;color:var(--mu);padding:13px 2px;font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--ac2);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{border-color:var(--ac)}
.big{font-size:26px;font-weight:800;line-height:1.25;margin:2px 0 6px}
.mu{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--s2);border-radius:11px;padding:11px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:800}
.btn.w{width:100%}
.btn.sm{padding:6px 11px;font-size:14px;min-height:36px}
.btn.dan{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.mt{margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.warn{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--badbg);color:var(--badtx);font-size:14px}
.note-ok{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--okbg);color:var(--oktx);font-size:14px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acbg);color:var(--ac2);white-space:nowrap}
h2{font-size:15px;color:var(--mu);font-weight:600;margin:18px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* ---- session (compact) ---- */
#sess{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--bd)}
.stitle{font-weight:800;font-size:18px;flex:1}
.corec{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.corec.done{background:var(--okbg);color:var(--ok)}
.sbody{padding:10px 10px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.inp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;outline:none}
.inp:focus{border-color:var(--ac)}
.ex{padding:10px 11px;margin-bottom:8px;border-radius:12px}
.ex.core{border-inline-start:3px solid var(--ac)}
.exh{display:flex;align-items:center;gap:7px}
.exname{background:none;border:0;padding:0;font-weight:800;font-size:16px;text-align:start;cursor:pointer}
.chk{margin-inline-start:auto;color:var(--ok);font-weight:800}
.pmsg{font-size:12.5px;border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.pmsg.ok{background:var(--okbg);color:var(--oktx)}
.pmsg.mid{background:var(--midbg);color:var(--midtx)}
.pmsg.bad{background:var(--badbg);color:var(--badtx)}
.tnote{font-size:13px;color:var(--tx2);background:var(--s2);border-radius:8px;padding:6px 9px;margin-top:7px}
.sb{width:34px;height:40px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);font-size:17px;padding:0}
.cl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--bd);border-radius:99px;padding:4px 11px 4px 8px;cursor:pointer}
.cl input{width:18px;height:18px;accent-color:var(--ac);margin:0}
.cl.on{border-color:var(--okbd);color:var(--ok)}
.mini{font-size:13px;border:1px solid var(--bd);background:none;border-radius:99px;padding:4px 11px;color:var(--mu)}
.mini.on{color:var(--ac2);border-color:var(--midbd)}
.ex .noteI{margin-top:7px;min-height:38px;padding:6px 9px;font-size:14px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#sess[hidden],[hidden]{display:none!important}
.mbox{background:var(--s1);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 10px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--mu)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
pre.cardtxt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:14px/1.6 system-ui,sans-serif;margin:0 0 12px;unicode-bidi:plaintext}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--s1);border-radius:99px;padding:8px 14px;color:var(--mu)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:800}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700}
.icb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td{padding:8px 4px;border-bottom:1px solid var(--bd)}
select.inp{appearance:auto}
.btn.rec{border:2px solid var(--ok);color:var(--oktx);background:var(--okbg)}
.btn.rec{white-space:nowrap}
.btn.rec::after{content:' ✓';color:var(--ok)}
#sess .shead{padding-bottom:10px}
.pbar{height:3px;background:var(--s2);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:2}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.sbody{padding-bottom:calc(28px + env(safe-area-inset-bottom))!important}
.meta2{display:flex;gap:8px;margin-bottom:10px}
.meta2 label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.meta2 label.cy{flex:.45}
.meta2 .inp{min-height:40px;padding:6px 9px}
.ex{padding:12px 12px 12px;margin-bottom:12px;border-radius:14px;border-inline-start-width:1px}
.ex.core{border-inline-start:4px solid var(--ac)}
.ex.dn{border-color:var(--okbd);background:var(--okbg)}
.ex.dn.core{border-inline-start-color:var(--ok)}
.exno{flex:none;width:24px;height:24px;border-radius:50%;background:var(--s2);color:var(--mu);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ex.dn .exno{background:var(--ok);color:var(--onac)}
.exname{font-size:18px;font-weight:800;flex:1;min-width:0}
.tgt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:6px 0 0;font-size:13px;color:var(--mu)}
.tgt b{color:var(--tx);font-size:14px}
.wrow{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--bg);border:1px solid var(--acbd);border-radius:12px;padding:6px 8px}
.wrow .wi{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:800;min-height:48px;border:0;background:none;padding:0}
.wrow .un{font-size:13px;color:var(--mu);width:14px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:flex-end}
.scell{flex:1;min-width:58px;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.scell .lb{font-size:11px;color:var(--mu);text-align:center}
.scell .inp{height:56px;text-align:center;font-size:24px;font-weight:800;padding:0}
.sadd{display:flex;flex-direction:column;gap:4px}
.sadd .sb{width:40px;height:26px;font-size:16px;line-height:1}
.cl.big{padding:9px 16px 9px 12px;font-size:14.5px;min-height:44px}
.cl.big input{width:22px;height:22px}
.sfoot{position:static;display:flex;gap:8px;padding:6px 10px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sfoot .btn{min-height:52px;font-size:16px}
.sfoot .sp{flex:1}
.hero{border-color:var(--ac);background:linear-gradient(180deg,var(--hero) 0,var(--s1) 60%);padding:14px 14px 12px}
.rot{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:12px}
.rs{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.rs.ld{color:var(--ok);border-color:var(--okbd)}
.rs.nx{color:var(--onac);background:var(--ac);border-color:var(--ac);font-weight:800}
.hero .big{font-size:30px;margin:0 0 8px}
.xl{border-top:1px solid var(--bd);margin-top:4px}
.xr{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14.5px}
.xr .xn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.xr.c .xn{color:var(--ac2)}
.xr .xs{font-style:normal;color:var(--ac);font-size:12px}
.xr .xw{color:var(--mu);font-size:13px;white-space:nowrap}
.coreline{font-size:12.5px;color:var(--mu);margin-top:9px;line-height:1.5}
.big2{min-height:56px;font-size:17px}
.alt{margin-top:10px}
.alt summary{color:var(--mu);font-size:13.5px;padding:8px 2px;cursor:pointer;list-style:none;text-align:center}
.alt summary::-webkit-details-marker{display:none}
.alt[open] summary{color:var(--ac2)}
.wkc{display:flex;align-items:center;gap:14px;padding:11px 14px}
.dots{display:flex;gap:7px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd)}
.dots i.goal{border-color:var(--midbd)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.wkt{font-weight:800;font-size:15px}
.bkn{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);background:var(--s1);border:1px dashed var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.bkn div{flex:1}
.sl{display:flex;flex-direction:column;gap:6px}
.sc{display:flex;align-items:center;gap:10px;padding:7px 11px;background:var(--s1);border:1px solid var(--bd);border-inline-start:4px solid var(--mu);border-radius:10px;cursor:pointer;min-height:48px}
.sc.full{border-inline-start-color:var(--ok)}.sc.core{border-inline-start-color:var(--mid)}.sc.part{border-inline-start-color:var(--bad)}
.sc:active{background:var(--s2)}
.sc .n{font-weight:800;font-size:15px;line-height:1.25}
.sc .d{font-size:12px;color:var(--mu);line-height:1.3}
.sc .sp{min-width:0}
.sc .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.sc.full .st{color:var(--ok);background:var(--okbg)}.sc.core .st{color:var(--mid);background:var(--midbg)}.sc.part .st{color:var(--bad);background:var(--badbg)}

/* ====== هيكل مشترك للثيمات (الشكل مش اللون بس) ====== */
.card,.ex,.sc,.bkn,.wrow,.warn,.note-ok,.tnote,.pmsg{border-radius:var(--rad)}
.card,.ex,.sc,.wrow{border-width:var(--bw)}
.card,.ex,.sc{box-shadow:var(--sh)}
.btn,.inp,.sb,.icb,.cl,.mini,.chips button{border-radius:var(--radb)}
.tag,.rs,.corec,.sc .st{border-radius:var(--radp)}
.mbox{border-radius:var(--rad) var(--rad) 0 0}
.wi,.scell .inp,.xw,.d,.wkt,.exno,.cycle,table.h td{font-family:var(--fnum)}
.big,.brand,.stitle,.exname,h2,.sc .n,.rs,.tabs button{text-transform:var(--ttl);letter-spacing:var(--ls)}
/* --- الشعار: علامة بار + كلمة بوزنين --- */
.brand{display:flex;align-items:center;gap:10px;flex:1;text-transform:none;letter-spacing:0}
.brand .lg{width:34px;height:22px;flex:none;color:var(--ac)}
.brand .wm{display:flex;align-items:baseline;gap:7px;direction:ltr}
.brand .wm i{font-style:normal;font-weight:300;font-size:14px;letter-spacing:.34em;color:var(--tx);opacity:.9;margin-inline-end:-2px}
.brand .wm b{font-weight:900;font-size:21px;letter-spacing:.06em;color:var(--ac2)}
.brand .wm::after{content:'';align-self:center;width:18px;height:2px;border-radius:2px;background:var(--ac);opacity:.7;margin-inline-start:2px}
html[data-th] .brand .wm b,html .brand .wm b{font-family:inherit;font-style:normal;font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--tx);opacity:.95;text-shadow:none;background:none;-webkit-background-clip:border-box;background-clip:border-box}
.brand .wm{gap:3px}
.brand .wm::after{display:none!important}
html[data-th] .brand .wm b,html .brand .wm b{font-size:12px;letter-spacing:.02em}
.brand .wm i{margin-inline-end:-.3em}
.ex.wn{border-color:var(--midbd);background:var(--midbg)}
.ex.wn.core{border-inline-start-color:var(--mid)}
.ex.wn .exno{background:var(--mid);color:var(--onac)}
.ex.wn .chk{color:var(--mid)}
.brand .lg{cursor:pointer;padding:9px 8px;box-sizing:content-box;margin:-9px -8px;-webkit-tap-highlight-color:transparent}
.brand .lg.spin{animation:lgspin 1s cubic-bezier(.5,.05,.2,1)}
@keyframes lgspin{to{transform:rotate(360deg)}}
.sysopt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:var(--rad);margin-bottom:8px;background:var(--s1)}
.sysopt.on{border-color:var(--ac);background:var(--acbg)}
.sysc .big{margin-bottom:2px}
.prl .prow{cursor:pointer}
.prl .prow:active{background:var(--s2)}
.prow .exno{margin-inline-end:2px}
.lbd{display:flex;align-items:center;gap:6px;font-size:13px}.lbd select{padding:8px 6px;min-width:0;max-width:130px}
.lgrp{border-bottom:1px solid var(--bd)}
.lgrp>summary{display:flex;align-items:center;gap:10px;padding:15px 2px;font-weight:800;font-size:16px;list-style:none;cursor:pointer}
.lgrp>summary::-webkit-details-marker{display:none}
.lgrp>summary b{flex:1}
.lgrp[open]>summary .pchev{transform:rotate(180deg)}
.lgc{font-size:12px;font-weight:700;color:var(--mu);background:var(--s2);border-radius:99px;padding:2px 9px}
.qt{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.qrow{margin:0 0 14px}.qrow .mu{margin:0 2px 8px}.qrow .thseg{margin:0}
.thseg{display:flex;gap:4px;padding:4px;background:var(--s2);border:1px solid var(--bd);border-radius:99px;margin:0 0 14px}
.thseg button{flex:1;background:none;border:0;border-radius:99px;padding:11px 0;font-size:15px;font-weight:700;color:var(--mu);min-height:44px}
.thseg button.on{background:var(--ac);color:var(--onac)}
.dsec{margin:0 0 12px;font-size:15.5px;line-height:1.8}.dsec:last-child{margin-bottom:0}.dsec b{display:block;font-size:12.5px;color:var(--ac2);margin-bottom:2px}.dsec.k3 b{color:var(--bad)}.dsec.k4 b{color:var(--ok)}.cyb{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:none;color:var(--ac2);padding:3px 9px 3px 2px;margin-right:2px;border-right:1px solid var(--bd);white-space:nowrap;align-self:center}
.lbx{border-bottom:1px solid var(--bd)}.lbx:last-child{border-bottom:0}.lbx summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer}.lbx summary::-webkit-details-marker{display:none}.lbx summary .nm{font-weight:700;flex:1}.lbx .howto{margin:0 0 12px}.lbx .row{margin-bottom:12px}.lbx summary::after{content:'▾';color:var(--mu)}.lbx[open] summary::after{content:'▴'}
.howto{font-size:16px;line-height:1.8;background:var(--s2);border-radius:var(--rad);padding:12px 14px}
/* ---- أداء شاشة التمرين: من غير blur ولا ظلال، ورسم الكروت اللي ظاهرة بس ---- */
#sess .card,#sess .shead,#sess .btn,#sess .inp,#sess .wrow{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;text-shadow:none!important}
#sess .ex{content-visibility:auto;contain-intrinsic-size:auto 330px}
#sess{background-attachment:scroll!important}
#sess *{transition:none!important}
#sess .ex{will-change:auto}

/* ===== شاشة الجلسة: تخطيط مضغوط (v35) ===== */
#sess .ex{padding:9px 10px;margin-bottom:8px;contain-intrinsic-size:auto 175px}
#sess .exh{gap:6px}
#sess .exname{flex:1;min-width:0;text-align:start;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sess .exno{width:22px;height:22px;font-size:12px}
#sess .cstar{color:var(--ac2);font-size:14px}

.psys{display:flex;align-items:center;gap:4px;width:100%;background:none;border:0;padding:4px 2px 12px;color:var(--tx);font-weight:700;font-size:16px;text-align:start;white-space:nowrap;overflow:hidden}
.psys .mu{font-weight:400;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pchev{margin-inline-start:auto;color:var(--mu);font-size:14px;flex:none}
.ptabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin-bottom:14px}
.ptabs button{flex:1;min-width:0;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;color:var(--mu);font-weight:600;font-size:15px;margin-bottom:-1px}
.ptabs button.on{color:var(--ac2);border-bottom-color:var(--ac);font-weight:800}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.pdn{font-size:20px;font-weight:700}
.ptxt,.plink{background:none;border:0;color:var(--ac2);font-size:14px;padding:6px 4px}
.plist{margin-bottom:12px}
.pr2{display:block;border-bottom:1px solid var(--bd)}
.pr2:last-child{border-bottom:0}
.pr2>summary,.pr2b{display:flex;align-items:center;gap:12px;padding:13px 2px;list-style:none;cursor:pointer}
.pr2>summary::-webkit-details-marker{display:none}
.pr2 .pnm{font-weight:700;font-size:16px}
.pno{flex:none;width:22px;text-align:center;color:var(--mu);font-weight:600}
.pno.cr{color:var(--ac2);font-weight:800}
.pr2[open] .pchev{transform:rotate(180deg)}
.pdrop{padding:0 2px 12px 36px;display:flex;align-items:center;justify-content:space-between;gap:10px}
[dir=rtl] .pdrop,html[lang=ar] .pdrop{padding:0 36px 12px 2px}
.pr2:has(.pgrip){display:flex;align-items:center}
.pgrip{flex:none;width:36px;text-align:center;color:var(--mu);font-size:22px;touch-action:none;user-select:none;padding:8px 0}
.pr2.drag{background:var(--s2);opacity:.9}
.pr2b{flex:1;min-width:0}
.pact{display:flex;gap:6px;justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px}
.pcore{color:var(--tx2);font-size:14px;margin:6px 2px 14px;line-height:1.6}
.pcore b{color:var(--ac2)}
.pgo{margin-bottom:8px}
.lsearch{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.lsearch input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font-size:16px;padding:12px 2px;outline:0}
.lsearch .ptxt{flex:none;white-space:nowrap}
.ptabs.scr{overflow-x:auto;scrollbar-width:none;margin-bottom:8px}.ptabs.scr::-webkit-scrollbar{display:none}
.ptabs.scr button{flex:none;padding:10px 14px}
.lcount{margin:2px 2px 4px;font-size:13px}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac2);flex:none}
.pdot.in{margin-inline-end:2px}
.lbn .lbody{padding:0 2px 12px}
.lbn>summary .sp{min-width:0}
.psel{flex:1;min-width:0;background:none;border:0;color:var(--mu);font-size:16px;padding:12px 2px;outline:0;appearance:none;-webkit-appearance:none}
.psel option,.psel optgroup{background:var(--s1);color:var(--tx)}
.lsearch:has(.psel){position:relative;margin-bottom:4px}
.pmon{margin:18px 2px 2px;color:var(--mu);font-size:13px;letter-spacing:.02em}
.pmon:first-child{margin-top:8px}
.pst{flex:none;font-size:13px;color:var(--mu)}
.pst.full{color:var(--ac2)}
.fhead{padding:6px 2px 16px;border-bottom:1px solid var(--bd)}
.fbig{font-size:28px;font-weight:700;line-height:1.3}
.fsec{border-bottom:1px solid var(--bd)}
.fsec>summary{list-style:none;display:flex;align-items:center;padding:16px 2px;font-weight:700;font-size:16px;cursor:pointer}
.fsec>summary::-webkit-details-marker{display:none}
.fsec[open]>summary .pchev{transform:rotate(180deg)}
.fbody{padding:0 2px 16px}
.pdot.er{background:var(--bad)!important}
/* شكل التطبيق الأصلي: من غير سكرول بار ولا overscroll، ولمس نضيف */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{overscroll-behavior:none}
button,.btn,.tabs,.top,.chips,summary,label,.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text}
</style>

/* ================= v108: الرجوع بعد الغياب (تلقائي بعد أي فترة غياب) =================
   القوة بتفضل تقريبًا ٢–٣ أسابيع. اللي بيقع الأول: حماية العضلة من الشد العنيف بعد التمرين، والنَفَس، والأوتار.
   فالرجوع بيقلّل المجموعات أكتر من الوزن، وبيوقف قبل الفشل. أي جلسة مخففة مابتتحسبش في قاعدة الزيادة،
   وبعد الخطة الأوزان بترجع لوزنك قبل الغياب لوحدها. */
const CBD=8;
function cbSteps(g){
  if(g<CBD)return[];
  if(g<=14)return[{k:'lt',p:.9}];
  if(g<=28)return[{k:'fb',p:.8},{k:'lt',p:.9}];
  if(g<=60)return[{k:'fb',p:.75},{k:'fb',p:.85},{k:'lt',p:.9}];
  return[{k:'fb',p:.7},{k:'fb',p:.8},{k:'lt',p:.85},{k:'lt',p:.9}];
}
const dGap=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
/* فين انت في خطة الرجوع: الغياب الأخير (لسه مارجعتش، أو رجعت ولسه في نص الخطة) */
function cbNow(){
  const ds=done();if(!ds.length)return null;
  const at=(g,i)=>{let st=cbSteps(g);if(i>=st.length)return null;
    if(st.some(x=>x.k==='fb')&&fbPick().length<3)st=st.map(x=>({k:'lt',p:x.p}));
    return{g,i,n:st.length,st,step:st[i],after:ds.slice(0,i).reverse()}};
  const g0=daysAgo(ds[0].date);if(g0>=CBD)return at(g0,0);
  for(let i=0;i<Math.min(ds.length-1,4);i++){const g=dGap(ds[i].date,ds[i+1].date);if(g>=CBD)return at(g,i+1)}
  return null;
}
/* فول بادي الرجوع: بيتبني من تمارين برنامجك انت. رجل ← صدر ← ضهر ← خلفية ← جذع. الأجهزة الأول لأنها أأمن بعد الغياب */
const fbGuess=n=>/leg press|squat|lunge|step.?up/i.test(n)?'quads':/leg curl|hamstring|deadlift|rdl|hip thrust|glute|bridge/i.test(n)?'posterior':/pulldown|pull.?up|chin|row/i.test(n)?'back':/bench|chest|push.?up|dip|(db|dumbbell|machine) press/i.test(n)?'chest':/plank|crunch|knee raise|leg raise|ab wheel|dead.?bug|pallof|hollow|sit.?up/i.test(n)?'core':'';
function fbPick(){
  const seen=new Set(),all=[];let o=0;
  for(const d of S.program.days)for(const t of d.ex){const k=nk(t.name);if(!k||seen.has(k))continue;seen.add(k);
    const n=t.name,L=libGet(n),m=(typeof META!=='undefined'&&META[n])||{};
    all.push({t,g:(L&&L[1])||fbGuess(n),comp:m.kind?m.kind==='comp':/press|squat|row|pull|deadlift|lunge|thrust|dip/i.test(n),
      safe:m.eq?(m.eq==='mach'||m.eq==='cable'):/machine|leg press|hack|smith|pulldown|cable|leg curl|pec/i.test(n),core:!!t.core,o:o++})}
  const sc=x=>x.comp*8+x.core*4+x.safe*2;
  const SL=[['quads',x=>x.comp,sc],['chest',x=>x.comp,sc],['back',x=>x.comp,sc],['posterior',()=>1,x=>x.safe*8+x.core*2],['core',()=>1,x=>(x.t.unit==='ث')*8+x.core*2]];
  const out=[];
  for(const [g,ok,f] of SL){const c=all.filter(x=>x.g===g&&ok(x)).sort((a,b)=>f(b)-f(a)||a.o-b.o)[0];if(c)out.push({t:c.t,core:g==='quads'||g==='chest'||g==='back'})}
  return out;
}
/* التخفيف: فول بادي = مجموعتين. مخففة = مجموعة أقل (أقل حاجة ٢). الوزن نسبة من وزنك قبل الغياب */
function cbApply(e,cb){
  const n=cb.k==='fb'?2:Math.max(2,(+e.tsets||3)-1);if(n!==+e.tsets){e.tsets=n;e.sets=Array(n).fill('');e.dur=[]}
  const w=num(e.w);if(!e.unit&&w>0){const st=stepOf(e.name);e.w=String(Math.min(w,Math.max(st,Math.round(w*cb.p/st)*st)))}
}
/* الجلسة اللي هتتلعب (من غير حفظ): الرئيسية بتعرضها، و«ابدأ» بيفتحها */
function planDraft(id,c){
  const fb=id==='FB';let ex,dd=null;
  if(fb)ex=fbPick().map(x=>Object.assign(draftEx(x.t),{core:x.core}));
  else{dd=day(id);ex=dd.ex.map(t=>draftEx(t))}
  const l=realLast();
  const dr={id:uid(),editing:null,date:today(),day:fb?'FB':dd.id,dayName:fb?'Full Body':dd.name,cycle:fb?(l?l.cycle:(S.settings.cycle||1)):calcCycle(dd.id),ex};
  if(c){dr.cb={k:fb?'fb':'lt',p:c.step.p,g:c.g,i:c.i,n:c.n};if(!fb)dr.dayName+=' · Light';ex.forEach(e=>cbApply(e,dr.cb))}
  return dr;
}
const cbPct=cb=>Math.round(cb.p*100)+'%';
const cbLine=cb=>tr(`رجوع بعد ${cb.g} يوم · الأوزان ${cbPct(cb)} · سيب في إيدك 2–3 عدّات`,`Back after ${cb.g} days · weights ${cbPct(cb)} · leave 2–3 reps in the tank`);
function cbCard(c){
  const nm=s=>s.k==='fb'?tr('فول بادي','Full body'):tr('مخففة','Light'),ar=LANG==='ar',sep=`<i>${ar?'‹':'›'}</i>`;
  /* الخطوات اللي عدّت بتتعلّم بالجلسة اللي اتلعبت فعلًا (رجوع أو يوم عادي) */
  const pills=c.st.map((s,k)=>{if(k<c.i){const a=c.after[k];return `<span class="ok">✓ ${a&&a.cb?nm(a.cb)+' <bdi class="en">'+cbPct(a.cb)+'</bdi>':'<bdi class="en">'+esc(dayBase(a?a.dayName:''))+'</bdi>'}</span>`}
    return `<span class="${k===c.i?'on':''}">${nm(s)} <bdi class="en">${cbPct(s)}</bdi></span>`}).join(sep)+`${sep}<span>${tr('جدولك','Your plan')}</span>`;
  const dn=c.step.k==='fb'?'':day(nextDayId()).name;
  const how=c.step.k==='fb'?tr(`فول بادي: مجموعتين لكل تمرين، والأوزان ${cbPct(c.step)} من أوزانك قبل الغياب.`,`Full body: two sets per exercise, weights at ${cbPct(c.step)} of your pre-break weights.`)
    :tr(`<bdi class="en">${esc(dn)}</bdi> مخففة: مجموعة أقل في كل تمرين، والأوزان ${cbPct(c.step)} من أوزانك قبل الغياب.`,`${esc(dn)}, light: one set less per exercise, weights at ${cbPct(c.step)} of your pre-break weights.`);
  return `<button class="cbh" data-a="cbGo"><b>${tr(`رجوع بعد ${c.g} يوم`,`Back after ${c.g} days`)}</b><span class="cbt">${how} ${tr('وقّف وانت لسه قادر على 2–3 عدّات.','Stop each set with 2–3 reps left.')}</span><span class="cbs" dir="${ar?'rtl':'ltr'}">${pills}</span><span class="cbgo">${tr('ابدأ جلسة الرجوع','Start the comeback session')} ${ar?'‹':'›'}</span></button>`;
}
/* اقتراح بس: بيتفتح لما تدوس على الكارت. الدايرة و«ابدأ يوم تاني» والبرنامج بيفتحوا يومك العادي بأوزانك */
function startComeback(){
  const c=cbNow();if(!c)return;
  if(S.draft&&!confirm(T().confNew))return;
  S.draft=null;S.draft=planDraft(c.step.k==='fb'?'FB':nextDayId(),c);
  openTips.clear();save();openSession();
}
/* وزن الشغل: آخر وزن من جلسة عادية (جلسات الرجوع المخففة مابتغيّرش وزنك) */
const baseH=id=>{const hh=exHist(id);return hh.find(x=>!x.cb)||hh[0]};

/* قاعدة الزيادة: الهدف كامل في يومين منفصلين على نفس الوزن */
function progState(t,h){
  h=h.filter(x=>!x.cb);/* v108: جلسات الرجوع مخففة عن قصد: مابتتحسبش في قاعدة الزيادة */
  if(!h.length)return null;
  const W=+h[0].w||0;let q=0,n=0;const ds=new Set();
  for(const x of h){if((+x.w||0)!==W)break;n++;if(x.clean&&!ds.has(x.date)&&x.sets.length>=t.sets&&x.sets.every(r=>r>=t.goal)){ds.add(x.date);q++}}
  if(q>=2)return{k:'up'};if(n>=5)return{k:'stuck',n};if(q===1)return{k:'q1'};return null;
}
const STEP0={bb:2.5,db:2,mach:5,cable:5,kb:4,bw:2.5,band:2.5,other:2.5};
const stepOf=n=>{const o=S.steps&&S.steps[nk(n)];if(o>0)return o;const m=typeof META!=='undefined'&&META[n];return STEP0[(m&&m.eq)||'other']||2.5};
function progMsg(t,h,unit,name){
  const p=progState(t,h);if(!p)return null;const L=T();
  if(p.k==='up'){const w=+h[0].w||0,st=name?stepOf(name):0;
    if(!unit&&w>0&&st>0&&st/w>.15)return{c:'mid',t:L.pCtl(st,Math.round(st/w*100))};
    return{c:'ok',t:unit?L.pUpU(t.sets,t.goal):L.pUp(t.sets,t.goal)}}
  if(p.k==='stuck')return{c:'bad',t:L.pStuck(p.n)};
  return{c:'mid',t:L.pQ1(t.sets,t.goal)};
}
const durSum=e=>(e.dur||[]).reduce((a,b)=>a+(+b||0),0);
const durLine=e=>e.dur&&e.dur.some(x=>x>0)?tr('الوقت','Time')+': '+e.dur.map(x=>x>0?mmss(x):'—').join(' | ')+' | '+tr('الإجمالي','Total')+' '+mmss(durSum(e)):'';
function cardText(s){
  const tm=!s.imp&&s.ts?new Date(s.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
  const L=[`Cycle ${s.cycle}`,`${s.dayName} — ${s.date}${tm?' · '+tm:''}`];if(s.cb)L.push(tr(`رجوع بعد ${s.cb.g} يوم · الأوزان ${cbPct(s.cb)}`,`Back after ${s.cb.g} days · weights ${cbPct(s.cb)}`));L.push('');
  for(const e of s.ex){L.push(e.name);L.push(`${fw(e.w)} | ${setsStr(e)}${e.clean?' | '+T().clean:''}`);const dl=durLine(e);if(dl)L.push(dl);if(e.note)L.push(e.note);L.push('')}
  const tot=s.ex.reduce((a,e)=>a+durSum(e),0);if(tot>0)L.push(tr('إجمالي وقت المجموعات: ','Total set time: ')+mmss(tot),'');
  const d=S.program.days.find(x=>x.id===s.day);const c=d?coreNames(d):s.ex.filter(e=>e.core).map(e=>e.name);
  if(c.length)L.push(T().coreLine+': '+c.join(' + '));
  return L.join('\n').trim();
}
function tplCard(d){
  const L=[`Cycle ${calcCycle(d.id)}`,'',d.name,''];
  for(const t of d.ex){const l=baseH(t.id);L.push(t.name);L.push(`${fw(l?l.w:t.w)} | ${t.sets}×${t.reps}${t.unit?' '+unitTxt(t.unit):''}`);if(t.note)L.push(t.note);L.push('')}
  L.push(T().coreLine+': '+coreNames(d).join(' + '));
  return L.join('\n');
}
/* نص منظم للتحليل بالذكاء الاصطناعي */
function aiText(s,skip){
  const L=T(),out=[];
  const dObj=S.program.days.find(x=>x.id===s.day);
  const tpl=dObj?dObj.ex:[];
  const coreAll=tpl.filter(t=>t.core),coreDone=coreAll.filter(t=>s.ex.some(e=>e.exId===t.id)).length;
  out.push(L.aiHead(s.dayName,s.cycle));
  out.push(`${L.aiDate}: ${s.date} (${fmtD(s.date)})`);
  if(coreAll.length)out.push(L.aiCore(coreDone,coreAll.length));
  if(s.cb)out.push(tr(`جلسة رجوع بعد غياب ${s.cb.g} يوم (${s.cb.k==='fb'?'فول بادي':'يوم مخفف'}): الأوزان ${cbPct(s.cb)} من أوزانه قبل الغياب والمجموعات أقل عن قصد، ومابتتحسبش في قاعدة الزيادة.`,`Comeback session after a ${s.cb.g}-day break (${s.cb.k==='fb'?'full body':'light day'}): weights at ${cbPct(s.cb)} of pre-break and fewer sets on purpose; it does not count toward the progression rule.`));
  out.push(L.aiUnits);out.push(L.aiRule);out.push('');
  s.ex.forEach((e,i)=>{
    const u=e.unit?' '+unitTxt(e.unit):'';
    out.push(`${i+1}. ${e.name}${e.core?' '+L.aiCoreTag:''}`);
    out.push(`   ${L.aiTarget}: ${e.tsets||e.sets.length}×${e.treps||''}${u}`);
    out.push(`   ${L.aiWeight}: ${noW(e.w)?(e.unit?'—':L.bw):(+e.w)+' kg'}`);
    out.push(`   ${L.aiSets}: ${e.sets.join(', ')}${u}`);
    {const dl=durLine(e);if(dl)out.push('   '+dl)}
    if(e.clean)out.push(`   ${L.aiForm}: ${L.aiClean}`);
    const h=exHist(e.exId,skip).filter(x=>x.date<=s.date);const prev=h[0];
    if(prev)out.push(`   ${L.aiLast} (${prev.date}): ${noW(prev.w)?'—':(+prev.w)+' kg'} — ${prev.sets.join('/')}${u}${prev.clean?', '+L.clean:''}`);
    const p=s.cb?null:progState({sets:e.tsets||e.sets.length,goal:e.goal||e.treps||12},[Object.assign({date:s.date},e)].concat(h));
    if(p)out.push(`   ${L.aiStatus}: ${p.k==='stuck'?L.st2.stuck(p.n):L.st2[p.k]}`);
    if(e.note)out.push(`   ${L.aiNote}: ${e.note}`);
    out.push('');
  });
  {const tot=s.ex.reduce((a,e)=>a+durSum(e),0);if(tot>0){out.push(tr('إجمالي وقت المجموعات: ','Total set time: ')+mmss(tot));out.push('')}}
  const miss=tpl.filter(t=>!s.ex.some(e=>e.exId===t.id)).map(t=>t.name);
  if(miss.length)out.push(`${L.aiNotDone}: ${miss.join(', ')}`);
  return out.join('\n').trim();
}
async function copy(t){if(window.Android){try{if(Android.copyText(String(t))){toast(T().copied);return true}}catch(e){}}try{await navigator.clipboard.writeText(t);toast(T().copied);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?T().copied:T().copyFail);return ok}}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t});toast(T().shared);return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);toast(T().copiedInstead)}catch(e){copy(t)}
}

function parseCSV(txt){
  txt=String(txt).replace(/^\uFEFF/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=c;
  }

}
function csvToSessions(txt){
  const rows=parseCSV(txt).slice(1),map=new Map();
  for(const r of rows){
    if(r.length<9||!/^\d{4}-\d{2}-\d{2}$/.test(r[0]))continue;
    const key=r[0]+'|'+r[1]+'|'+r[2];
    let s=map.get(key);
    if(!s){s={id:uid(),date:r[0],cycle:+r[1]||1,dayName:r[2]||'?',status:'imp',ts:new Date(r[0]+'T12:00:00').getTime(),ex:[]};map.set(key,s)}
    const sets=String(r[5]).split('/').map(Number).filter(v=>!isNaN(v)&&String(v)!=='');
    s.ex.push({name:r[3],exId:'h:'+r[3],w:+r[4]||0,sets,unit:'',clean:r[8]==='1',core:r[9]==='1',note:r[10]||''});

}

  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,d=S.draft,L=T();
  switch(a){
    case 'lang':$('#toast').classList.remove('on');LANG=LANG==='en'?'ar':'en';S.settings.lang=LANG;save();applyLang();if(!$('#sess').hidden)renderSession();if(!$('#modal').hidden)closeModal();go(tab);break;
    case 'start':if(b.classList.contains('orb'))orbGo(b,()=>startSession(b.dataset.d));else startSession(b.dataset.d);break;
    case 'resume':if(b.classList.contains('orb'))orbGo(b,openSession);else openSession();break;
    case 'closeS':flushSave();closeSession();if(S.draft)queueDraftBackup();break;
    case 'shareDraft':shareDraft();break;
    case 'discard':if(confirm(d.editing?L.confCancelEdit:L.confDiscard)){S.draft=null;openTips.clear();save();closeSession()}break;
    case 'addset':d.ex[i].sets.push('');save();renderSession();break;
    case 'exGo':goEx(i);break;
    case 'setTap':{const j=+b.dataset.j,e=d.ex[curEx];if(num(e.sets[j])>0){openPick('s',j);break}
      e.sets[j]=String(e.treps);b.classList.add('on');b.firstElementChild.textContent=e.treps;saveSoon();updCore();break}
    case 'pickW':openPick('w');break;
    case 'pickOk':{const l=$('#pkl');if(!l||!pk)break;const v=pk.vals[Math.max(0,Math.min(pk.vals.length-1,Math.round(l.scrollTop/44)))],e=d.ex[curEx];
      if(pk.kind==='w'){const old=num(e.w),ps=d.cb?null:progState({sets:e.tsets,goal:e.goal},exHist(e.exId,d.editing));
        if(ps&&ps.k==='up'&&!e.unit&&v>(isNaN(old)?0:old)&&+e.goal>8){e.goal=8;e.treps=8;toast(tr('وزن جديد: الهدف النهارده ٨ عدّات','New weight: today\'s target is 8 reps'))}
        e.w=String(v)}else e.sets[pk.j]=String(v);saveSoon();closeSheet();renderSession();break}
    case 'stepSet':{const e=d.ex[curEx];S.steps=S.steps||{};S.steps[nk(e.name)]=+b.dataset.v;save();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderSession();break}
    case 'coreOnly':{const keep=d.ex.filter(x=>x.core);if(keep.length&&!d.editing){d.ex=keep;curEx=0;save();closeSheet();renderSession();toast(tr('اليوم بقى الأساسي بس ✓','Essentials only ✓'))}break}
    case 'bodySave':{const w=num($('#bW').value),c=num($('#bC').value);if(!(w>0)&&!(c>0)){toast(tr('اكتب الوزن أو الوسط','Enter weight or waist'));break}
      S.body=S.body||[];const t=today();let r=S.body.find(x=>x.d===t);if(!r){r={d:t};S.body.push(r)}if(w>0)r.w=w;if(c>0)r.c=c;fOpen.add('body');save();queueBackup();renderData();toast(tr('اتسجّل ✓','Logged ✓'));break}
    case 'bodyDel':S.body=(S.body||[]).filter(x=>x.d!==b.dataset.d);save();renderData();break
    case 'pickClr':{if(pk){const e=d.ex[curEx];e.sets[pk.j]='';if(e.dur&&e.dur[pk.j])e.dur[pk.j]=0;saveSoon();closeSheet();renderSession()}break}
    case 'pickRm':{if(pk&&d.ex[curEx].sets.length>1){d.ex[curEx].sets.splice(pk.j,1);if(d.ex[curEx].dur)d.ex[curEx].dur.splice(pk.j,1);saveSoon();closeSheet();renderSession()}break}
    case 'closeSheet':closeSheet();break;
    case 'menu':openMenu();break;
    case 'sw':swTap();break;
    case 'finish':finishSession();break;
    case 'copyDone':if(lastDone)copy(cardText(lastDone));break;
    case 'doneClose':closeSession();go('home');break;
    case 'tgl':{const k=b.dataset.k;openTips.has(k)?openTips.delete(k):openTips.add(k);renderSession();break}
    case 'hist':closeSheet();exHistModal(b.dataset.id);break;
    case 'guide':openGuide();break;
    case 'sess':sessModal(b.dataset.id);break;
    case 'copyS':copy(cardText(S.sessions.find(x=>x.id===b.dataset.id)));break;
    case 'aiS':{const s=S.sessions.find(x=>x.id===b.dataset.id);if(s)shareText(aiText(s,s.id));break}
    case 'editS':editSession(b.dataset.id);break;
    case 'undoRestore':undoRestore();break;
    case 'delS':if(confirm(L.confDel)){S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);if(S.draft&&S.draft.editing===b.dataset.id)S.draft=null;save();queueBackup();closeModal();go(tab)}break;
    case 'closeM':closeModal();break;
    case 'pday':pDay=b.dataset.d;renderProgram();break;
    case 'exInfo':infoModal(i);break;
    case 'sysOpen':sysModal();break;
    case 'pedit':pEdit=!pEdit;renderProgram();break;
    case 'sysPick':if(confirm(tr('هتبدّل النظام. تمارينك الحالية محفوظة وترجعلها. تكمّل؟','Switch system? Your current exercises are kept. Continue?'))){switchSys(b.dataset.id);closeModal();renderProgram();toast(tr('النظام اتغيّر ✓','System changed ✓'))}break;
    case 'libOpen':libQ='';libG='all';libFor='prog';libModal();break;
    case 'sxOpen':closeSheet();libQ='';libG='all';libFor='sess';libModal();break;
    case 'sxProg':S.settings.sxProg=b.dataset.v==='1'?1:0;save();libModal();break;
    case 'sxAdd':{const d=S.draft;if(!d)break;const n=b.dataset.n;let k=d.ex.findIndex(e=>nk(e.name)===nk(n));
      if(k<0){const pd=S.program.days.find(x=>x.id===d.day);let t=null;
        if(pd&&S.settings.sxProg){t=pd.ex.find(x=>nk(x.name)===nk(n));if(!t){t=mk(n);pd.ex.push(t)}}
        const e=draftEx(t||mk(n));if(d.cb)cbApply(e,d.cb);d.ex.push(e);k=d.ex.length-1;save();queueBackup();
        toast(pd&&S.settings.sxProg?tr('اتضاف للجلسة وللبرنامج ✓','Added to the session and the program ✓'):tr('اتضاف للجلسة ✓','Added to the session ✓'))}
      else toast(tr('التمرين موجود في الجلسة','Already in this session'));
      closeModal();curEx=k;wAnim=true;renderSession();wAnim=false;$('#sess').scrollTop=0;break}
    case 'cbGo':if(b.classList.contains('cbh')){try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}startComeback();break;
    case 'libG':libG=b.dataset.g;libModal();break;
    case 'cuNew':cuModal();break;
    case 'cuEdit':cuModal(b.dataset.n);break;
    case 'hwEdit':closeSheet();hwModal(b.dataset.n);break;
    case 'hwSave':hwSave(b.dataset.n);break;
    case 'hwReset':{const n=b.dataset.n,old=libHow(n);if(S.libOv)delete S.libOv[n];hwApply(n,old);toast(tr('رجع الأصلي ✓','Restored ✓'));break}
    case 'cuSave':cuSave(b.dataset.n);break;
    case 'cuDel':if(confirm(tr('تحذف التمرين ده من مكتبتك؟ برنامجك وسجلك مش هيتأثروا.','Delete this exercise from your library? Your program and log are not affected.'))){S.custom=(S.custom||[]).filter(x=>x.name!==b.dataset.n);save();queueBackup();closeModal();renderLib()}break;
    case 'qGest':S.settings.qGest=b.dataset.k==='off'?0:1;save();renderData();break;
    case 'howLang':S.settings.howLang=b.dataset.k==='en'?'en':'ar';save();renderData();break;
    case 'lbE':lbE=b.dataset.e;{const c=$('#lbEC'),l=$('#lbL');if(c)c.innerHTML=lbEChips();if(l)l.innerHTML=libRows()}break;
    case 'lbG':lbG=b.dataset.g;{const c=$('#lbC'),l=$('#lbL');if(c)c.innerHTML=lbChips();if(l)l.innerHTML=libRows()}break;
    case 'lbAdd':modal(`<h3>${tr('تضيفه لأنهي يوم؟','Add to which day?')}</h3><div class="mu en" style="margin-bottom:10px;text-align:start">${esc(b.dataset.n)}</div>${S.program.days.map(x=>`<button class="btn w" style="margin-bottom:8px" data-a="lbPick" data-d="${x.id}" data-n="${esc(b.dataset.n)}"><bdi>${esc(x.name)}</bdi></button>`).join('')}<button class="btn ghost w" data-a="closeM">${T().close}</button>`);break
    case 'lbPick':{const dd=day(b.dataset.d);if(dd){dd.ex.push(mk(b.dataset.n));save();queueBackup();closeModal();lbRefresh();toast(tr('اتضاف لـ ','Added to ')+dd.name+' ✓')}break}
    case 'libAdd':{const t=mk(b.dataset.n);day(pDay).ex.push(t);save();queueBackup();closeModal();renderProgram();toast(tr('اتضاف ✓','Added ✓'));break}
    case 'dayAdd':{const nd={id:'D'+uid(),name:tr('يوم جديد','New day'),ex:[]};S.program.days.push(nd);pDay=nd.id;save();queueBackup();renderProgram();dayModal();break}
    case 'dayEdit':dayModal();break;
    case 'daySave':{const v=$('#dName').value.trim();if(v){day(pDay).name=v;save();queueBackup()}closeModal();renderProgram();break}
    case 'dayDel':if(confirm(tr('تحذف اليوم ده بتمارينه؟ السجل القديم مش هيتأثر.','Delete this day and its exercises? Your log is not affected.'))){S.program.days=S.program.days.filter(x=>x.id!==pDay);pDay=S.program.days[0].id;save();queueBackup();closeModal();renderProgram()}break;
    case 'editT':tplModal(i);break;
    case 'addT':cuModal();break;
    case 'saveT':saveTpl(i);break;
    case 'delT':if(confirm(L.confDelEx)){day(pDay).ex.splice(i,1);save();queueBackup();closeModal();renderProgram()}break;
    case 'copyT':copy(tplCard(day(pDay)));break;
    case 'backup':backupNow();break;
    case 'share':shareBackup();break;
    case 'link':linkFile();break;
    case 'csv':exportCSV();break;
    case 'theme':S.settings.theme=b.dataset.k==='morning'?'morning':'iron';save();applyTheme();renderData();break;
    case 'syncOn':enableSync();break;
    case 'syncNow':{chg++;SYNC.dirty=true;runBackup(true).then(ok=>toast(ok?T().syncOK:T().syncErr(syncMsg(SYNC.err))));break}
    case 'syncOff':disableSync();break;
    case 'syncRestore':restoreRemote();break;
  }
});
const sess=$('#sess');
function onField(ev){
  const t=ev.target,d=S.draft;if(!d)return;
  if(t.id==='sDate'){d.date=t.value;saveSoon();return}
  if(t.id==='sCyc'){const n=num(t.value);if(n>0)d.cycle=n;save();return}
  const c=t.closest('.wmain');if(!c)return;const e=d.ex[+c.dataset.i],f=t.dataset.f;
  if(f==='w')e.w=t.value;else if(f==='s')e.sets[+t.dataset.j]=t.value;else if(f==='n')e.note=t.value;else return;
  saveSoon();updCore();
}
sess.addEventListener('input',onField);sess.addEventListener('change',onField);
let tx=0,ty=0,tsh=false;
let tt=0;
sess.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();tsh=!!e.target.closest('#sheet,input')},{passive:true});
sess.addEventListener('touchend',e=>{if(!S.draft||tsh)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,fast=Date.now()-tt<300;if(Math.abs(dx)<(fast?24:42)||Math.abs(dx)<Math.abs(dy))return;goEx(curEx+((LANG==='ar'?dx>0:dx<0)?1:-1))},{passive:true});
let gTap=false;
sess.addEventListener('touchstart',e=>{gTap=!!e.target.closest('.wname')},{passive:true});
sess.addEventListener('touchend',e=>{if(!gTap)return;gTap=false;if(!S.draft)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)<22&&Math.abs(dy)<22&&Date.now()-tt<700){e.preventDefault();openGuide()}},{passive:false});
sess.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const all=[...sess.querySelectorAll('input.inp')];const k=all.indexOf(ev.target);if(k>-1&&all[k+1]){ev.preventDefault();all[k+1].focus()}});

/* ================= التثبيت والتحديث ================= */
let updating=false,r=false;
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js?v='+VER).then(reg=>{
    reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){const u=$('#updBtn');u.hidden=false;u.onclick=()=>{updating=true;saveUI();flushSave();reg.waiting&&reg.waiting.postMessage('skip')}}};
    show();reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')show()})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating&&!r){r=true;location.reload()}});
}
/* تسخين: أول رسم للسجل والمكتبة بيبقى أبطأ، فبنعمله مرة في الخلفية وإنت على الرئيسية (من غير ما يبان) */
function warmTabs(){try{if(tab!=='home'||!$('#sess').hidden||!$('#modal').hidden)return;renderHistory();renderLib();renderHome()}catch(e){}}
function readUI(){try{return JSON.parse(localStorage.getItem('gymlog.ui')||'null')}catch(e){return null}}
function restoreUI(u){try{if(!u||Date.now()-u.at>12*36e5)return;
  if(u.t&&u.t!=='home')navTab(u.t);
  if(u.s&&S.draft)openSession();else if(u.y)setTimeout(()=>window.scrollTo(0,u.y),50)}catch(e){}}
window.addEventListener('scroll',()=>{clearTimeout(window.__st);window.__st=setTimeout(saveUI,250)},{passive:true});
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushSave();saveUI();if(S.draft)queueDraftBackup()}else if(!$('#sess').hidden)wakeOn()});
const UI0=readUI();
boot().then(()=>{if(migTheme()){delete S.settings.thGr;delete S.settings.thDawn;save()}applyLang();if(S.impN){const k=S.impN;S.impN=0;save();setTimeout(()=>toast(T().histNote(k)),600)}go('home');restoreUI(UI0);setTimeout(()=>('requestIdleCallback' in window?requestIdleCallback(warmTabs,{timeout:4000}):warmTabs()),2500);if(pendMig){toast(T().migNote);pendMig=false}if(SYNC.on&&SYNC.dirty)setTimeout(runBackup,1500)});
</script>
